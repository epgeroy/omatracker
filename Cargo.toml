[package]
name = "time-tracker"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Project time tracking backend and CLI for the Omarchy TimeTracker plugin"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
fs2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.15"
uuid = { version = "1.13", features = ["v4"] }
