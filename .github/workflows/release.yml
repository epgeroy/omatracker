name: Release OmaTracker

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Verify tag and source
        run: |
          test "$GITHUB_REF_NAME" = "v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "omatracker") | .version')"
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build the matching backend
        run: |
          cargo build --locked --release
          install -m755 target/release/omatracker omatracker-linux-x86_64
          sha256sum omatracker-linux-x86_64 > omatracker-linux-x86_64.sha256
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" omatracker-linux-x86_64 omatracker-linux-x86_64.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
